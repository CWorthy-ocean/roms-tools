name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-without-dask:
    name: ${{ matrix.python-version }}-build (use_dask=False)
    runs-on: ubuntu-latest
    strategy:
      # Keep the other Python version running when one fails; otherwise the
      # surviving job is cancelled and its log shows a misleading exit code 143.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: ci/environment.yml
          create-args: |
            python=${{ matrix.python-version }}
          # The env-file hash must be in the key, or edits to ci/environment.yml
          # are silently ignored whenever a cached environment is restored.
          cache-environment-key: micromamba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}

      - name: Conda info
        run: conda info

      # All conda jobs build from ci/environment.yml, so verifying here is
      # enough to prove the serial-ESMF pin took effect. Expect a `nompi_*`
      # esmf build and no mpich at all.
      - name: Verify serial (nompi) ESMF build
        shell: micromamba-shell {0}
        if: always()
        run: micromamba list | grep -E "esmf|mpich|hdf5" || true

      - name: Install roms-tools
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e .[movie,dev] --force-reinstall

      - name: Running Tests (use_dask=False)
        shell: bash -l {0}
        run: |
           python -V
           coverage run --rcfile=coverage.toml -m pytest --verbose roms_tools/tests/*

      # This job runs the whole suite, so it is the one with a complete set of
      # data files worth caching. One Python version is enough.
      - name: Save pooch data cache
        if: always() && matrix.python-version == '3.13'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}

      - name: Get coverage report
        shell: bash -l {0}
        run: |
          coverage report -m || true
          coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: without-dask
          name: without-dask-py${{ matrix.python-version }}
          fail_ci_if_error: false

  test-with-streaming:
    name: 3.13-build-with-streaming
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: ci/environment.yml
          create-args: |
            python=${{ matrix.python-version }}
          # The env-file hash must be in the key, or edits to ci/environment.yml
          # are silently ignored whenever a cached environment is restored.
          cache-environment-key: micromamba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}

      - name: Conda info
        run: conda info

      - name: Install roms-tools
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e .[stream,movie,dev]  --force-reinstall

      - name: Running Tests with Streaming
        shell: bash -l {0}
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
           python -V
           copernicusmarine login
           coverage run --rcfile=coverage.toml -m pytest -m stream --stream --use_dask --use_gcsfs --use_copernicus --verbose roms_tools/tests/*
        timeout-minutes: 20

      - name: Get coverage report
        shell: bash -l {0}
        run: |
          coverage report -m || true
          coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: with-streaming
          name: with-streaming
          fail_ci_if_error: false

  test-with-dask-and-xesmf-1:
    name: 3.13-build (use_dask=True) - part 1
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: ci/environment.yml
          create-args: |
            python=${{ matrix.python-version }}
          # The env-file hash must be in the key, or edits to ci/environment.yml
          # are silently ignored whenever a cached environment is restored.
          cache-environment-key: micromamba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}

      - name: Conda info
        run: conda info


      - name: Install roms-tools
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e .[movie,dev]

      - name: Running Tests (use_dask=True, xesmf)
        shell: bash -l {0}
        run: |
           python -V
           coverage run --rcfile=coverage.toml -m pytest --use_dask --verbose roms_tools/tests/ --ignore=roms_tools/tests/test_setup/test_boundary_forcing.py --ignore=roms_tools/tests/test_setup/test_initial_conditions.py --ignore=roms_tools/tests/test_setup/test_surface_forcing.py

      - name: Get coverage report
        shell: bash -l {0}
        run: |
          coverage report -m || true
          coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: with-dask-and-xesmf-1
          name: with-dask-and-xesmf-1
          fail_ci_if_error: false

  test-with-dask-and-xesmf-2:
    name: 3.13-build (use_dask=True) - part 2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: ci/environment.yml
          create-args: |
            python=${{ matrix.python-version }}
          # The env-file hash must be in the key, or edits to ci/environment.yml
          # are silently ignored whenever a cached environment is restored.
          cache-environment-key: micromamba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}

      - name: Conda info
        run: conda info


      - name: Install roms-tools
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e .[dev]

      - name: Running Tests (use_dask=True, xesmf)
        shell: bash -l {0}
        run: |
           python -V
           coverage run --rcfile=coverage.toml -m pytest --use_dask --verbose roms_tools/tests/test_setup/test_boundary_forcing.py roms_tools/tests/test_setup/test_initial_conditions.py roms_tools/tests/test_setup/test_surface_forcing.py

      - name: Get coverage report
        shell: bash -l {0}
        run: |
          coverage report -m || true
          coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: with-dask-and-xesmf-2
          name: with-dask-and-xesmf-2
          fail_ci_if_error: false

  test-glorys-regional-invariance:
    name: 3.13-build-glorys-regional-invariance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/roms-tools
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Create conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          cache-downloads: true
          cache-environment: true
          micromamba-version: 'latest'
          environment-file: ci/environment.yml
          create-args: |
            python=${{ matrix.python-version }}
          # The env-file hash must be in the key, or edits to ci/environment.yml
          # are silently ignored whenever a cached environment is restored.
          cache-environment-key: micromamba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}

      - name: Conda info
        run: conda info

      - name: Install roms-tools
        shell: micromamba-shell {0}
        run: |
           python -V
           python -m pip install -e .[dev] --force-reinstall
           python -m pip install copernicusmarine

      - name: Running Tests (use_dask=True)
        shell: bash -l {0}
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
           python -V
           copernicusmarine login
           coverage run --rcfile=coverage.toml -m pytest --use_copernicus --use_dask --verbose -k "test_invariance_to_get_glorys_bounds" roms_tools/tests/

      - name: Get coverage report
        shell: bash -l {0}
        run: |
          coverage report -m || true
          coverage xml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: glorys-regional-invariance
          name: glorys-regional-invariance
          fail_ci_if_error: false

  test-windows:
    name: windows-build (use_dask=False)
    runs-on: windows-latest
    env:
      # The hosted Windows runner's Tcl/Tk install is broken (Can't find a usable
      # init.tcl), which matplotlib hits by defaulting to the TkAgg backend.
      # Force a non-interactive backend so plotting tests don't touch Tk at all.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      # A cold pooch cache means ~1.6 GB of timeout-prone downloads from GitHub.
      # Every job restores; only the full-suite jobs save (so a job running a
      # subset cannot replace the cache with an incomplete snapshot). The key
      # tracks the registries in download.py, and restore-keys still reuses the
      # previous cache, leaving only newly added files to download.
      - name: Restore pooch data cache
        uses: actions/cache/restore@v4
        with:
          # pooch.os_cache("roms-tools") -> %LOCALAPPDATA%\roms-tools\roms-tools\Cache
          # (platformdirs repeats the name because appauthor defaults to appname).
          path: ~/AppData/Local/roms-tools/roms-tools/Cache
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install roms-tools
        shell: bash
        run: |
           python -V
           python -m pip install -e ".[dev]"

      # The Windows cache path above is hardcoded and cannot be resolved off
      # Windows; print the real one so a mismatch shows up in the log instead
      # of silently disabling the cache.
      - name: Show pooch cache location
        if: always()
        shell: bash
        run: python -c "import pooch; print(pooch.os_cache('roms-tools'))"

      - name: Running Tests
        shell: bash
        run: |
           python -V
           pytest --verbose roms_tools/tests

      # The only Windows job, and it runs the whole suite.
      - name: Save pooch data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/roms-tools/roms-tools/Cache
          key: pooch-${{ runner.os }}-${{ hashFiles('roms_tools/datasets/download.py') }}
