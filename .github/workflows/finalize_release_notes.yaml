name: Finalize Release Notes

# Builds the release notes for <tag> from the fragments in changes/ and opens the
# "Finalize release notes for <tag>" PR from next_release_notes. Edit the notes
# on that PR if needed; merging it makes publish_release.yaml create the GitHub
# release and delete next_release_notes. The branch name and PR title are what
# publish_release.yaml matches on, so keep them in step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to finalize (e.g. 4.1.0)"
        required: true
        type: string

jobs:
  finalize-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install towncrier
        # Same pin as changelog.yaml.
        run: pip install "towncrier==26.9.0"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate release tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          # Standardized convention: tags have no leading v (e.g. 0.5.0).
          tag="$(printf '%s' "$RAW_TAG" | tr -d '`[:space:]')"
          tag="${tag#v}"
          tag="${tag#V}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)*$'; then
            echo "::error::'$RAW_TAG' is not a release tag like 4.1.0."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create next_release_notes from main
        run: |
          # A leftover branch is a release PR still open, or one closed without
          # merging. Stop rather than overwrite edits made on it.
          if git ls-remote --exit-code --heads origin next_release_notes >/dev/null; then
            echo "::error::Branch next_release_notes already exists. Merge or close its release PR and delete the branch, then run this workflow again."
            exit 1
          fi
          git checkout -b next_release_notes origin/main

      - name: Build the release notes from changes/
        # Writes the "## <tag>" section into docs/releases.md and stages it, and
        # git-removes the fragments it used.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: towncrier build --yes --version "$TAG"

      - name: Commit and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git commit -m "Finalize release notes for $TAG"
          git push origin next_release_notes

      - name: Open pull request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Note: PRs opened with the default GITHUB_TOKEN do not trigger
          # other workflows (e.g. docs build, tests) on the PR itself.
          gh pr create \
            --base main \
            --head next_release_notes \
            --title "Finalize release notes for $TAG" \
            --body "Release notes for \`$TAG\`, built by towncrier from the fragments in \`changes/\`. Edit them here before merging; merging creates the GitHub release."
